version: '3.9'

services:

  mysql:
    image: mysql:8.4

    container_name: mysql-autos

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autos_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  autos-api:

    build: .

    container_name: autos-backend

    restart: always

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/autos_db

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: root

volumes:

  mysql_data: