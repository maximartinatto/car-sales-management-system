
services:

  mysql:
    image: mysql:8.4
    container_name: mysql-autos
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autos_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  autos-api:
    build: .
    container_name: autos-backend
    restart: always

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/autos_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      # Administradores MAGIN
      MAGIN_ADMIN1_USERNAME: ${MAGIN_ADMIN1_USERNAME:?Configurar administrador 1}
      MAGIN_ADMIN1_PASSWORD_HASH: ${MAGIN_ADMIN1_PASSWORD_HASH:?Configurar hash administrador 1}

      MAGIN_ADMIN2_USERNAME: ${MAGIN_ADMIN2_USERNAME:?Configurar administrador 2}
      MAGIN_ADMIN2_PASSWORD_HASH: ${MAGIN_ADMIN2_PASSWORD_HASH:?Configurar hash administrador 2}

    volumes:
      - uploads_data:/uploads

volumes:
  mysql_data:
  uploads_data:
