spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sistema_autos?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.tomcat.max-part-count=50


# MAGIN - Administradores
magin.admin1.username=${MAGIN_ADMIN1_USERNAME}
magin.admin1.password-hash=${MAGIN_ADMIN1_PASSWORD_HASH}

magin.admin2.username=${MAGIN_ADMIN2_USERNAME}
magin.admin2.password-hash=${MAGIN_ADMIN2_PASSWORD_HASH}
